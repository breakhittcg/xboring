<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>XBoring</title>
  <style>
    :root {
      --bg: #0c0c0c;
      --card: #141414;
      --line: #222;
      --line2: #2e2e2e;
	  --blue: #1d9bf0;
      --text: #f2f2f2;
      --mid: #999;
      --dim: #e7e9ea;
      --red: #ff5252;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 300px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 400;
    }

    /* ── HEADER ── */
    .header {
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      background: var(--blue);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-icon svg {
      width: 14px;
      height: 14px;
    }

    .logo-name {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--text);
    }

    /* ── TOGGLE ── */
    .toggle-wrap { display: flex; align-items: center; gap: 6px; }

    .toggle-label {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 12px;
	  font-weight: 600;
      color: var(--dim);
      letter-spacing: 0.06em;
      transition: color 0.2s;
    }
    .toggle-label.on { color: var(--blue); }

    .pill {
      position: relative;
      width: 34px;
      height: 18px;
      cursor: pointer;
    }
    .pill input { display: none; }

    .pill-track {
      position: absolute;
      inset: 0;
      background: #71767b;

      border-radius: 9px;
      transition: all 0.18s;
    }
    .pill-thumb {
      position: absolute;
      top: 1px; left: 0px;
      width: 16px; height: 16px;
      border-radius: 50%;
      background: var(--dim);
      transition: all 0.2s cubic-bezier(.4,0,.2,1);
    }
    .pill input:checked ~ .pill-track {
      background: var(--blue);

    }
    .pill input:checked ~ .pill-thumb {
      transform: translateX(16px);
      background: #fff;
    }

    /* ── STAT ── */
    .stat {
      margin: 12px 16px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
    }

    .stat-label {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--dim);
      margin-bottom: 3px;
    }

    .stat-num {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 36px;
      font-weight: 600;
      color: var(--blue);
      line-height: 1;
      letter-spacing: -0.03em;
    }

    .stat-since {
      font-size: 10px;
      color: var(--dim);
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      text-align: right;
      line-height: 1.4;
    }

    /* ── FILTERS ── */
    .filters-header {
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 7px;
    }

    .filters-label {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--dim);
    }

    .filters-count {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 11px;
      color: var(--mid);
      background: #1a1a1a;
      border: 1px solid var(--line2);
      border-radius: 3px;
      padding: 2px 5px;
    }

    .filters-list {
      margin: 0 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      max-height: 156px;
      overflow-y: auto;
    }

    .filters-list::-webkit-scrollbar { width: 2px; }
    .filters-list::-webkit-scrollbar-thumb { background: var(--blue); }

    .filter-row {
      display: flex;
      align-items: center;
      padding: 7px 10px;
      border-bottom: 1px solid var(--line);
      gap: 8px;
      transition: background 0.12s;
    }

    .filter-row:last-child { border-bottom: none; }
    .filter-row:hover { background: #181818; }

    .filter-row:first-child { animation: none; }
    .filter-row { animation: pop 0.15s ease; }

    @keyframes pop {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .filter-pip {
      width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--green);
      opacity: 0.4;
      flex-shrink: 0;
    }

    .filter-text {
      flex: 1;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 12px;
      color: var(--mid);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .filter-del {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--dim);
      font-size: 12px;
      line-height: 1;
      padding: 2px 4px;
      border-radius: 3px;
      transition: all 0.12s;
      flex-shrink: 0;
    }
    .filter-del:hover { color: var(--red); background: rgba(255,82,82,0.08); }

    /* ── ADD ── */
    .add-wrap {
      margin: 8px 16px 0;
      display: flex;
      gap: 6px;
    }

    .add-input {
      flex: 1;
      background: #71767b;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 7px 10px;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 11px;
      outline: none;
      transition: border-color 0.15s;
    }
    .add-input:focus { border-color: var(--green); }
    .add-input::placeholder { color: var(--dim); }

    .add-btn {
      background: var(--blue);
      border: none;
      border-radius: 7px;
      padding: 7px 11px;
      color: #e7e9ea;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.12s, transform 0.1s;
    }
    .add-btn:hover { opacity: 0.85; }
    .add-btn:active { transform: scale(0.97); }

    /* ── FOOTER ── */
    .footer {
      margin: 10px 16px 14px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
    }

    .reset-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 10px;
      color: var(--dim);
      letter-spacing: 0.04em;
      padding: 4px 0;
      transition: color 0.12s;
    }
    .reset-btn:hover { color: var(--red); }

    /* ── TABS ── */
    .tabs {
      display: flex;
      margin: 0 16px 8px;
	 
      border-bottom: 1px solid var(--line);
    }
    .tab-btn {
      background: none;
      border: none;
	  flex: 1;
	  justify-content: center;
      text-align: center;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      padding: 6px 12px;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 14px;
      font-weight: 500;
      color: var(--mid);
      cursor: pointer;
      letter-spacing: 0.04em;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .tab-btn.active { color: var(--blue); border-bottom-color: var(--blue); }
    .tab-count {
      font-size: 12px;
      background: var(--line2);
      border-radius: 3px;
      padding: 1px 5px;
      color: var(--mid);
    }
    .tab-btn.active .tab-count { background: var(--blue); color: #fff; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    .empty-state {
      padding: 18px;
      text-align: center;
      font-size: 11px;
      color: var(--mid);
    }
    .add-prefix {
      display: flex;
      align-items: center;
      padding: 0 8px;
      background: #71767b;
      border: 1px solid var(--line);
      border-right: none;
      border-radius: 7px 0 0 7px;
      font-size: 12px;
      color: var(--text);
      font-weight: 600;
    }
    .add-input.with-prefix {
      border-radius: 0 7px 7px 0;
      border-left: none;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">
<img src="icon128.png" style="width:26px;height:26px;border-radius:6px;object-fit:cover;">
      <span class="logo-name">XBORING</span>
    </div>
    <div class="toggle-wrap">
      <span class="toggle-label on" id="toggle-label">ON</span>
      <label class="pill">
        <input type="checkbox" id="main-toggle" checked>
        <div class="pill-track"></div>
        <div class="pill-thumb"></div>
      </label>
    </div>
  </div>

  <div class="stat">
    <div>
      <div class="stat-label">Boring Posts hidden</div>
      <div class="stat-num" id="hidden-count">0</div>
    </div>

  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tab-keywords">Keywords <span class="tab-count" id="count-keywords">0</span></button>
    <button class="tab-btn" id="tab-accounts">Accounts <span class="tab-count" id="count-accounts">0</span></button>
  </div>

  <div class="tab-panel active" id="panel-keywords">
    <div class="filters-list" id="list-keywords"></div>
    <div class="add-wrap">
      <input class="add-input" type="text" id="input-keywords" placeholder="keyword or phrase…">
      <button class="add-btn" id="add-keywords">+ Add</button>
    </div>
  </div>

  <div class="tab-panel" id="panel-accounts">
    <div class="filters-list" id="list-accounts"></div>
    <div class="add-wrap">
      <div class="add-prefix">@</div>
      <input class="add-input with-prefix" type="text" id="input-accounts" placeholder="username">
      <button class="add-btn" id="add-accounts">+ Add</button>
    </div>
  </div>

  <div class="footer">
    <button class="reset-btn" id="reset-btn">↺ reset to defaults</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
